<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FLoRA: Multiple Task Realizations for Embodiment-Adaptive Robot Manipulation">
  <title>FLoRA | Robot Pouring Demonstrations</title>
  <style>
    :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #192d3b; background: #ffffff; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; }
    .container { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
    header { text-align: center; padding: 84px 0 64px; }
    h1 { font-size: clamp(72px, 12vw, 116px); line-height: 1; letter-spacing: -.075em; margin: 0 0 20px; font-weight: 800; }
    h1 span { color: #0c9d9a; }
    .subtitle { max-width: 820px; margin: 0 auto; font-size: clamp(19px, 2.7vw, 27px); font-weight: 520; line-height: 1.45; }
    .affiliation { margin: 18px 0 0; color: #738391; font-size: 15px; }
    h2 { text-align: center; font-size: 26px; letter-spacing: -.025em; margin: 0 0 26px; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .demo { margin: 0; min-width: 0; }
    .media { aspect-ratio: 4 / 3; background: #f5f8f9; border: 1px solid #e3e9ec; border-radius: 12px; overflow: hidden; display: grid; place-items: center; }
    .media img { display: none; width: 100%; height: 100%; object-fit: contain; }
    .media.ready img { display: block; }
    .media.ready .fallback { display: none; }
    .fallback { text-align: center; color: #87969f; font-size: 13px; line-height: 1.6; padding: 20px; }
    figcaption { text-align: center; padding-top: 15px; font-size: 17px; font-weight: 650; }
    footer { text-align: center; padding: 75px 20px 30px; color: #82909a; font-size: 13px; }
    footer a { text-underline-offset: 3px; }
    @media (max-width: 750px) {
      header { padding: 60px 0 48px; }
      .gallery { grid-template-columns: 1fr; gap: 28px; max-width: 560px; margin: auto; }
      h2 { margin-bottom: 24px; }
      footer { padding-top: 55px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <header class="container">
    <h1>FL<span>o</span>RA</h1>
    <p class="subtitle">Multiple Task Realizations for Embodiment-Adaptive Robot Manipulation</p>
    <p class="affiliation">The University of Tokyo</p>
  </header>
  <main class="container">
    <section aria-labelledby="demos-title">
      <h2 id="demos-title">Pouring Demonstrations</h2>
      <div class="gallery">
        <figure class="demo">
          <div class="media">
            <img src="assets/panda.gif" alt="Franka Panda pouring demonstration" loading="eager">
            <div class="fallback">Panda GIF<br>Coming soon</div>
          </div>
          <figcaption>Franka Panda</figcaption>
        </figure>
        <figure class="demo">
          <div class="media">
            <img src="assets/ur5e.gif" alt="UR5e pouring demonstration" loading="eager">
            <div class="fallback">UR5e GIF<br>Coming soon</div>
          </div>
          <figcaption>UR5e</figcaption>
        </figure>
        <figure class="demo">
          <div class="media">
            <img src="assets/sawyer.gif" alt="Sawyer pouring demonstration" loading="eager">
            <div class="fallback">Sawyer GIF<br>Coming soon</div>
          </div>
          <figcaption>Sawyer</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <footer>FLoRA · The University of Tokyo · <a href="https://github.com/Nothingisavaliable/FloRA-website" target="_blank" rel="noopener noreferrer">Website source</a></footer>
  <script>
    document.querySelectorAll(".media img").forEach(img => {
      const show = () => img.parentElement.classList.add("ready");
      if (img.complete && img.naturalWidth > 0) show();
      else img.addEventListener("load", show, { once: true });
    });
  </script>
</body>
</html>
